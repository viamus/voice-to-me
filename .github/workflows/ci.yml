name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.9.16
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.12 --no-python-downloads
      - name: Lint
        run: .\.venv\Scripts\python.exe -m ruff check src tests scripts
      - name: Test simulated devices and adapters
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Build wheel
        run: uv build --wheel
      - name: Verify packaged assets
        run: .\.venv\Scripts\python.exe scripts/check_wheel.py
