[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "voice-to-me"
version = "0.1.0"
description = "Voice to Me: local Windows dictation with Codex refinement and clipboard output."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "sounddevice>=0.5,<0.6",
  "faster-whisper>=1.1,<2",
  "pynput>=1.7.7,<2",
  "pystray>=0.19,<0.20",
  "Pillow>=10.4,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
gpu = [
  "nvidia-cublas-cu12>=12.9,<13; sys_platform == 'win32' and platform_machine == 'AMD64'",
  "nvidia-cudnn-cu12>=9.20,<10; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[project.scripts]
voice-to-me = "voice_to_me.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_to_me"]
